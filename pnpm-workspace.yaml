packages:
  - frontend/apps/*
  - frontend/packages/*

# Nuxt's published config types import Vite without declaring it as a dependency.
# Match the existing Nuxt/Vite runtime instead of resolving Vitest's hoisted Vite 6.
packageExtensions:
  '@nuxt/schema@4.5.2':
    dependencies:
      vite: 8.2.2

allowBuilds:
  '@alicloud/openapi-core': true
  bufferutil: true
  core-js: true
  esbuild: true
  # BullMQ works without this optional native accelerator; keep installs script-free here.
  msgpackr-extract: false
  utf-8-validate: true
  vue-demi: true

minimumReleaseAgeExclude:
  - vue-router@5.3.1
