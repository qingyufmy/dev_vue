packages:
  - frontend/apps/*
  - frontend/packages/*

allowBuilds:
  '@alicloud/openapi-core': true
  bufferutil: true
  core-js: true
  esbuild: true
  # BullMQ works without this optional native accelerator; keep installs script-free here.
  msgpackr-extract: false
  utf-8-validate: true
  vue-demi: true

minimumReleaseAgeExclude:
  - vue-router@5.3.1
