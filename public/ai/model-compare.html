<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史多模型对比 - Admin</title>
<link rel="icon" href="/favicon.ico?v=20260720a" sizes="any">
<link rel="stylesheet" href="/ai/styles.css?v=20260720a">
<script>
(function() {
  var t = new URLSearchParams(window.location.search).get('token');
  if (t) localStorage.setItem('authToken', t);
  if (!t) t = localStorage.getItem('authToken');
  if (!t) { window.location.replace('/'); }
})();
</script>
</head>
<body class="compare-page-body">

<div class="compare-page-container">
  <header class="compare-page-header">
    <a href="/ai/" class="compare-page-back">&larr; 返回AI交易实验室</a>
    <h1>历史多模型对比</h1>
    <p class="compare-page-subtitle">选择时间范围与模型，回测对比各模型的信号表现</p>
  </header>

  <section class="compare-page-controls">
    <div class="compare-form-grid">
      <div class="compare-field">
        <label for="cmpSymbol">交易品种</label>
        <input id="cmpSymbol" type="text" placeholder="例: XAUUSD" value="XAUUSD">
      </div>
      <div class="compare-field">
        <label for="cmpTimeframe">K线周期</label>
        <select id="cmpTimeframe">
          <option value="M1">M1</option>
          <option value="M5">M5</option>
          <option value="M15">M15</option>
          <option value="M30" selected>M30</option>
          <option value="H1">H1</option>
          <option value="H4">H4</option>
          <option value="D1">D1</option>
        </select>
      </div>
      <div class="compare-field">
        <label for="cmpStartTime">开始时间</label>
        <input id="cmpStartTime" type="datetime-local">
      </div>
      <div class="compare-field">
        <label for="cmpEndTime">结束时间</label>
        <input id="cmpEndTime" type="datetime-local">
      </div>
      <div class="compare-field">
        <label for="cmpStrategy">推理策略</label>
        <select id="cmpStrategy"><option value="">加载中...</option></select>
      </div>
      <div class="compare-field">
        <label for="cmpStep">采样步长</label>
        <input id="cmpStep" type="number" min="1" max="50" value="10" title="每N根K线采样一次">
      </div>
    </div>

    <div class="compare-models-section">
      <label>选择对比模型 <span id="cmpModelHint" class="cmp-hint">勾选 2~5 个模型</span></label>
      <div id="cmpModelGroup" class="cmp-model-checkboxes">
        <span class="cmp-loading-text">加载模型列表...</span>
      </div>
    </div>

    <div class="compare-actions">
      <button id="cmpRunBtn" class="cmp-run-btn" disabled>
        <span class="cmp-run-btn-text">开始对比</span>
      </button>
      <span id="cmpStatus" class="cmp-status-text"></span>
    </div>

    <div id="cmpProgressBar" class="cmp-progress-bar hidden">
      <div id="cmpProgressFill" class="cmp-progress-fill" style="width:0%"></div>
      <span id="cmpProgressLabel" class="cmp-progress-label">准备中...</span>
    </div>
  </section>

  <section id="cmpResults" class="compare-page-results hidden">
    <div id="cmpResultsSummary" class="cmp-results-summary"></div>
    <div id="cmpResultsTableWrap" class="cmp-results-table-wrap"></div>
    <div id="cmpResultsTimeline" class="cmp-results-timeline"></div>
  </section>
</div>

<script>
(function() {
  const TOKEN = localStorage.getItem('authToken') || '';
  if (!TOKEN) { window.location.replace('/'); return; }
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN };

  const $ = id => document.getElementById(id);

  let allProfiles = [];
  let allStrategies = [];

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function providerLabel(p) { const m = { openai:'OpenAI', anthropic:'Anthropic', deepseek:'DeepSeek', moonshot:'Moonshot', google:'Google', kimi_code:'Kimi', zhipu:'智谱', baidu:'百度', alibaba:'阿里', volcengine:'火山引擎' }; return m[p] || p || '未知'; }

  async function apiFetch(url, opts) {
    const r = await fetch(url, { headers, ...opts });
    if (r.status === 401 || r.status === 403) { alert('登录已过期或无管理员权限'); window.location.replace('/'); throw new Error('auth'); }
    return r.json();
  }

  function setProgress(pct, label) {
    $('cmpProgressFill').style.width = pct + '%';
    $('cmpProgressLabel').textContent = label || '';
  }

  function setHint(count) {
    const el = $('cmpModelHint');
    if (count >= 2) { el.textContent = '已选 ' + count + ' 个模型'; el.classList.add('active'); }
    else if (count === 1) { el.textContent = '再选至少 1 个模型'; el.classList.remove('active'); }
    else { el.textContent = '勾选 2~5 个模型'; el.classList.remove('active'); }
    $('cmpRunBtn').disabled = count < 2;
  }

  function getSelectedModelIds() {
    return [...document.querySelectorAll('.cmp-model-cb:checked')].map(cb => Number(cb.value)).filter(id => id > 0);
  }

  async function loadModels() {
    try {
      const data = await apiFetch('/api/ai/model-profiles');
      allProfiles = (data.profiles || []).filter(p => p.status === 'active');
      const group = $('cmpModelGroup');
      if (!allProfiles.length) { group.innerHTML = '<span class="cmp-empty">无可用模型，请先创建模型配置</span>'; return; }
      group.innerHTML = allProfiles.map(p =>
        '<label class="cmp-model-label"><input type="checkbox" class="cmp-model-cb" value="' + p.id + '"><span class="cmp-model-name">' + escapeHtml(p.model_name) + '</span><small>' + escapeHtml(providerLabel(p.provider)) + '</small></label>'
      ).join('');
      group.querySelectorAll('.cmp-model-cb').forEach(cb => cb.addEventListener('change', () => setHint(getSelectedModelIds().length)));
    } catch (e) {
      $('cmpModelGroup').innerHTML = '<span class="cmp-empty">加载模型失败</span>';
    }
  }

  async function loadStrategies() {
    try {
      const data = await apiFetch('/api/ai/strategies?include_inactive=1');
      allStrategies = data.strategies || [];
      const sel = $('cmpStrategy');
      const active = allStrategies.filter(s => s.visibility_status === 'active' && Number(s.is_active));
      sel.innerHTML = '<option value="">请选择策略</option>' + active.map(s =>
        '<option value="' + s.id + '">' + escapeHtml(s.title) + (s.scope === 'private' ? ' (私有)' : '') + '</option>'
      ).join('');
    } catch (e) {
      $('cmpStrategy').innerHTML = '<option value="">加载失败</option>';
    }
  }

  function setDefaultDates() {
    const now = new Date();
    const beijing = new Date(now.getTime() + 8 * 3600000);
    const fmt = d => {
      const y = d.getUTCFullYear(), mo = String(d.getUTCMonth()+1).padStart(2,'0'), da = String(d.getUTCDate()).padStart(2,'0');
      const h = String(d.getUTCHours()).padStart(2,'0'), mi = String(d.getUTCMinutes()).padStart(2,'0');
      return y + '-' + mo + '-' + da + 'T' + h + ':' + mi;
    };
    const end = new Date(beijing);
    const start = new Date(end.getTime() - 7 * 24 * 3600000);
    $('cmpEndTime').value = fmt(end);
    $('cmpStartTime').value = fmt(start);
  }

  function buildSummary(results) {
    const valid = results.filter(r => r.status === 'success');
    const total = results.length;
    const successCount = valid.length;
    let html = '<div class="cmp-summary-cards">';
    html += '<div class="cmp-stat-card"><span class="cmp-stat-value">' + total + '</span><span class="cmp-stat-label">模型总数</span></div>';
    html += '<div class="cmp-stat-card"><span class="cmp-stat-value">' + successCount + '</span><span class="cmp-stat-label">成功返回</span></div>';

    if (valid.length) {
      const best = valid.reduce((a, b) => (b.simulated_pnl?.total || 0) > (a.simulated_pnl?.total || 0) ? b : a);
      const worst = valid.reduce((a, b) => (b.simulated_pnl?.total || 0) < (a.simulated_pnl?.total || 0) ? b : a);
      const avgWinRate = valid.reduce((s, r) => s + (r.simulated_pnl?.win_rate || 0), 0) / valid.length;
      html += '<div class="cmp-stat-card cmp-stat-best"><span class="cmp-stat-value">' + escapeHtml(best.model_name) + '</span><span class="cmp-stat-label">最佳 PnL: ' + best.simulated_pnl.total.toFixed(2) + '</span></div>';
      html += '<div class="cmp-stat-card"><span class="cmp-stat-value">' + avgWinRate.toFixed(1) + '%</span><span class="cmp-stat-label">平均胜率</span></div>';
    }
    html += '</div>';
    return html;
  }

  function buildTable(results) {
    const valid = results.filter(r => r.status === 'success');
    if (!valid.length) return '';
    let html = '<table class="cmp-table"><thead><tr><th>模型</th><th>提供商</th><th>信号数</th><th>买入</th><th>卖出</th><th>持有</th><th>错误</th><th>胜率</th><th>总PnL</th><th>平均PnL</th></tr></thead><tbody>';
    const sorted = [...valid].sort((a, b) => (b.simulated_pnl?.total || 0) - (a.simulated_pnl?.total || 0));
    for (const r of sorted) {
      const pnl = r.simulated_pnl;
      const pnlClass = pnl.total > 0 ? 'positive' : pnl.total < 0 ? 'negative' : '';
      html += '<tr><td>' + escapeHtml(r.model_name) + '</td><td>' + escapeHtml(providerLabel(r.provider)) + '</td>'
        + '<td>' + r.signal_count + '</td><td>' + pnl.buy_count + '</td><td>' + pnl.sell_count + '</td><td>' + pnl.hold_count + '</td><td>' + pnl.error_count + '</td>'
        + '<td>' + pnl.win_rate + '%</td><td class="' + pnlClass + '">' + pnl.total.toFixed(4) + '</td><td class="' + pnlClass + '">' + pnl.avg_pnl.toFixed(6) + '</td></tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  function buildTimeline(results, meta) {
    const valid = results.filter(r => r.status === 'success' && r.signals && r.signals.length);
    if (!valid.length) return '<div class="cmp-timeline-empty">无信号时间线数据</div>';

    const allTimes = new Set();
    valid.forEach(r => r.signals.forEach(s => allTimes.add(s.time)));
    const times = [...allTimes].sort();

    const modelColors = ['#d4af37', '#3b82f6', '#10b981', '#ef4444', '#a855f7', '#f59e0b', '#06b6d4', '#ec4899'];
    const models = valid.map((r, i) => ({ ...r, color: modelColors[i % modelColors.length] }));

    let html = '<h3 class="cmp-section-title">信号时间线</h3>';

    html += '<div class="cmp-legend">';
    models.forEach(m => { html += '<span class="cmp-legend-item"><span class="cmp-legend-dot" style="background:' + m.color + '"></span>' + escapeHtml(m.model_name) + '</span>'; });
    html += '</div>';

    html += '<div class="cmp-timeline-scroll"><div class="cmp-timeline-grid">';

    const dirIcon = { buy: '\u25B2', sell: '\u25BC', hold: '\u25CF', error: '\u2716' };
    const dirColor = { buy: '#22c55e', sell: '#ef4444', hold: '#eab308', error: '#6b7280' };

    for (const time of times) {
      html += '<div class="cmp-tl-row"><div class="cmp-tl-time">' + escapeHtml(String(time).replace('T', ' ').slice(5, 16)) + '</div><div class="cmp-tl-cells">';
      for (const m of models) {
        const sig = m.signals.find(s => s.time === time);
        if (sig) {
          const dir = sig.signal_type;
          const icon = dirIcon[dir] || '?';
          const c = dirColor[dir] || '#6b7280';
          const tip = dir.toUpperCase() + (sig.pnl ? ' PnL:' + sig.pnl.toFixed(4) : '') + (sig.error ? ' ERR:' + sig.error : '');
          html += '<span class="cmp-tl-cell" style="color:' + c + '" title="' + escapeHtml(tip) + '">' + icon + '</span>';
        } else {
          html += '<span class="cmp-tl-cell cmp-tl-empty">-</span>';
        }
      }
      html += '</div></div>';
    }
    html += '</div></div>';
    return html;
  }

  async function runCompare() {
    const symbol = $('cmpSymbol').value.trim().toUpperCase();
    const timeframe = $('cmpTimeframe').value;
    const strategyId = Number($('cmpStrategy').value || 0);
    const modelIds = getSelectedModelIds();
    const step = Number($('cmpStep').value) || 10;

    if (!symbol) { alert('请输入交易品种'); return; }
    if (!strategyId) { alert('请选择推理策略'); return; }
    if (modelIds.length < 2) { alert('至少选择 2 个模型'); return; }

    const startTime = $('cmpStartTime').value ? $('cmpStartTime').value + ':00' : '';
    const endTime = $('cmpEndTime').value ? $('cmpEndTime').value + ':00' : '';
    if (!startTime || !endTime) { alert('请选择时间范围'); return; }

    const btn = $('cmpRunBtn');
    btn.disabled = true;
    btn.querySelector('.cmp-run-btn-text').textContent = '对比中...';
    $('cmpResults').classList.add('hidden');
    $('cmpProgressBar').classList.remove('hidden');
    setProgress(10, '正在提交对比任务...');

    try {
      const stepProgress = [20, 40, 60, 80];
      let progressIdx = 0;
      const progressTimer = setInterval(() => {
        if (progressIdx < stepProgress.length) {
          setProgress(stepProgress[progressIdx], '推理进行中... (' + (progressIdx + 1) + '/' + stepProgress.length + ')');
          progressIdx++;
        }
      }, 8000);

      const data = await apiFetch('/api/ai/model-compare/history', {
        method: 'POST',
        body: JSON.stringify({ symbol, timeframe, model_ids: modelIds, strategy_id: strategyId, start_time: startTime, end_time: endTime, step }),
      });

      clearInterval(progressTimer);

      if (data.status !== 'success') {
        setProgress(100, '对比失败: ' + (data.message || '未知错误'));
        return;
      }

      setProgress(100, '对比完成，正在渲染结果...');
      const results = data.results || [];
      const meta = data.meta || {};

      $('cmpResultsSummary').innerHTML = buildSummary(results);
      $('cmpResultsTableWrap').innerHTML = buildTable(results);
      $('cmpResultsTimeline').innerHTML = buildTimeline(results, meta);

      let metaInfo = '<div class="cmp-meta-bar">品种: <strong>' + escapeHtml(meta.symbol || symbol) + '</strong> &middot; 周期: <strong>' + escapeHtml(meta.timeframe || timeframe) + '</strong> &middot; K线数: <strong>' + (meta.kline_count || 0) + '</strong> &middot; 采样步长: <strong>' + (meta.step || step) + '</strong> &middot; 时间: <strong>' + escapeHtml(String(meta.start_time || '').replace('T',' ').slice(0,16)) + ' ~ ' + escapeHtml(String(meta.end_time || '').replace('T',' ').slice(0,16)) + '</strong></div>';
      $('cmpResults').querySelector('.cmp-results-summary').insertAdjacentHTML('afterbegin', metaInfo);

      $('cmpResults').classList.remove('hidden');
      setProgress(100, '完成');
      $('cmpStatus').textContent = results.length + ' 个模型结果';
    } catch (e) {
      setProgress(100, '请求失败: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.querySelector('.cmp-run-btn-text').textContent = '开始对比';
      setHint(getSelectedModelIds().length);
      setTimeout(() => $('cmpProgressBar').classList.add('hidden'), 2000);
    }
  }

  $('cmpRunBtn').addEventListener('click', runCompare);

  setDefaultDates();
  Promise.all([loadModels(), loadStrategies()]);
})();
</script>
</body>
</html>
