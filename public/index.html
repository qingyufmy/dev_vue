<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://esm.sh;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com;
    img-src 'self' data: https:;
    connect-src 'self' https:;
    font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;
    frame-src 'self' https://player.bilibili.com https://www.youtube.com;
    media-src 'self' https: blob:;
  " />
  <title>华尔街没有技术-街哥课堂</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F6F8FB">
  
  
  <link rel="stylesheet" href="/src/quill.snow.css">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/admin-extras.css">
</head>
<body>
  <!-- Background Decoration -->
  <div class="bg-deco" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo" id="logoHome">
          <img class="logo-avatar" src="/logo-avatar.png" alt="logo">
          <span class="logo-text">华尔街没有技术</span>
        </div>
        <nav class="header-nav">
          <a class="header-nav-item" id="navTrades" aria-label="街哥历史战绩" data-short-label="战绩">
            <span class="header-nav-icon" aria-hidden="true">📊</span>
            <span class="header-nav-label">街哥历史战绩</span>
          </a>
          <a class="header-nav-item" id="navTools" aria-label="金融工具箱" data-short-label="工具">
            <span class="header-nav-icon" aria-hidden="true">🧰</span>
            <span class="header-nav-label">金融工具箱</span>
          </a>
          <a class="header-nav-item" id="navCommunity" aria-label="社区" data-short-label="社区">
            <span class="header-nav-icon" aria-hidden="true">💬</span>
            <span class="header-nav-label">社区</span>
          </a>
          <a class="header-nav-item" id="navMembership" aria-label="会员" data-short-label="会员">
            <span class="header-nav-icon" aria-hidden="true">⭐</span>
            <span class="header-nav-label">会员</span>
          </a>
          <button class="header-nav-item header-nav-menu-trigger" id="navMarketToggle" type="button" aria-label="打开股票市场研究菜单" aria-haspopup="true" aria-expanded="false" aria-controls="marketResearchMenu" data-short-label="股票研究" style="display:none">
            <span class="header-nav-icon" aria-hidden="true">📈</span>
            <span class="header-nav-label">股票市场研究</span>
            <span class="header-nav-caret" aria-hidden="true">▾</span>
          </button>
        </nav>
      </div>
      <div class="header-right">
        <a class="header-ai-link" id="navAI" href="/ai" target="_blank" aria-label="AI 交易">
          <span aria-hidden="true">🤖</span>
          <span>AI 交易</span>
        </a>
        <button class="btn btn-ghost btn-theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式">
          <span class="theme-toggle-icon" id="headerThemeIcon">🌙</span>
          <span class="theme-toggle-label" id="headerThemeLabel">深色</span>
        </button>
        <div class="user-info" id="userInfo" style="display:none">
          <div class="user-menu-wrap" id="userMenuWrap">
            <div class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">U</span>
              <span class="user-name-wrap">
                <span class="user-name" id="userName"></span>
              </span>
            </div>
            <div class="user-dropdown" id="userDropdown">
              <a class="dropdown-item" id="dropdownProfile">⚙️ 设置和账单</a>
              <a class="dropdown-item" id="dropdownNotifications">🧵 论坛通知 <span class="dropdown-badge" id="dropdownNotifBadge" style="display:none"></span></a>
              <a class="dropdown-item" id="dropdownAdmin" style="display:none">管理后台</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item dropdown-theme" id="dropdownTheme">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">深色模式</span>
              </a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item dropdown-logout" id="dropdownLogout">退出登录</a>
            </div>
          </div>
          <button class="btn btn-ghost btn-admin" id="adminBtn" style="display:none">管理后台</button>
        </div>
        <div class="auth-buttons" id="authButtons">
          <button class="btn btn-ghost" id="loginBtn">登录</button>
          <button class="btn btn-primary" id="registerBtn">注册</button>
        </div>
      </div>
      <div class="header-market-panel" id="marketResearchMenu" role="menu" aria-label="股票市场研究菜单" aria-hidden="true">
        <!-- Dynamic menu items loaded from system config -->
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-container">
      <div id="mainContent"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="authModal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-header">
        <h2 id="modalTitle">登录</h2>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
