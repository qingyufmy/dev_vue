<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>账户与订阅中心</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/account/styles.css?v=20260723b">
</head>
<body>
  <div id="accountApp" class="account-app">
    <header class="account-topbar">
      <a class="account-brand" href="/" aria-label="返回主站">
        <span class="account-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M8 7V5h8v2"/></svg></span>
        <span><strong>账户与订阅中心</strong><small>主站与 AI 实验室共用</small></span>
      </a>
      <div class="account-topbar-actions">
        <a class="button secondary" href="/ai/">进入 AI 实验室</a>
        <a class="button quiet" href="/">返回主站</a>
        <button id="accountCloseBtn" class="icon-button" type="button" aria-label="关闭账户中心">×</button>
      </div>
    </header>

    <main class="account-layout">
      <aside class="account-sidebar">
        <section id="accountIdentity" class="account-identity" aria-live="polite"><div class="skeleton avatar"></div><div><span class="skeleton line"></span><span class="skeleton line short"></span></div></section>
        <nav id="accountNav" class="account-nav" aria-label="账户中心导航">
          <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm10 7h6V11h-6v9ZM4 20h6v-3H4v3Zm10-13h6V4h-6v3Z"/></svg><span>账户概览</span></button>
          <button data-tab="profile"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><span>个人资料</span></button>
          <button data-tab="security"><svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5V11Z"/></svg><span>账户安全</span></button>
          <button data-tab="notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 13h4"/></svg><span>消息通知</span></button>
          <button data-tab="subscription"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3V6Zm0 4h18"/></svg><span>订阅与续费</span></button>
          <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6"/></svg><span>支付订单</span></button>
          <button data-tab="referral"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>邀请奖励</span></button>
        </nav>
        <button id="accountLogoutBtn" class="logout-button" type="button"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m12-9h5v18h-5"/></svg><span>退出全部前端</span></button>
      </aside>

      <section class="account-content">
        <header class="content-header"><div><p class="eyebrow">个人账户</p><h1 id="accountPageTitle">账户概览</h1><p id="accountPageDescription">查看会员状态和常用账户信息。</p></div><span id="accountSyncStatus" class="sync-status">正在同步</span></header>
        <div id="accountContent" class="content-body" aria-live="polite"><div class="page-loading"><span></span><strong>正在读取账户信息</strong></div></div>
      </section>
    </main>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <dialog id="paymentDialog" class="payment-dialog"><div id="paymentDialogContent"></div></dialog>
  <script src="/shared/session.js?v=20260723a"></script>
  <script src="/account/app.js?v=20260723a"></script>
</body>
</html>
