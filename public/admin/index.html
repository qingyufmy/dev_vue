<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>统一管理后台 · AI交易实验室</title>
  <script>
    (() => {
      const saved = localStorage.getItem('ws_theme')
      const theme = saved === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', theme)
      document.documentElement.style.colorScheme = theme
    })()
  </script>
  <link rel="stylesheet" href="/admin/styles.css?v=20260803modelruntime1">
</head>
<body>
  <a class="skip-link" href="#adminMain">跳到主要内容</a>
  <div class="admin-app">
    <aside class="admin-sidebar" aria-label="管理后台导航">
      <a class="brand" href="/admin/" aria-label="统一管理后台首页">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>AURUM 管理台</strong><small>业务运营工作台</small></span>
      </a>
      <nav class="side-nav">
        <p class="nav-group">运营工作台</p>
        <button class="nav-item is-active" data-view="overview" type="button" aria-current="page"><span data-icon="overview"></span><span>运营总览</span></button>
        <button class="nav-item" data-view="users" type="button"><span data-icon="users"></span><span>用户与会员</span></button>
        <button class="nav-item" data-view="commercial" type="button"><span data-icon="commercial"></span><span>商业运营</span></button>
        <p class="nav-group">智能交易治理</p>
        <button class="nav-item" data-view="ai-operations" type="button"><span data-icon="activity"></span><span>AI 运营</span></button>
        <button class="nav-item" data-view="risk-audit" type="button"><span data-icon="shield"></span><span>风控管理</span></button>
        <button class="nav-item" data-view="management-audit" type="button"><span data-icon="file"></span><span>管理审计</span></button>
        <p class="nav-group">平台维护</p>
        <button class="nav-item" data-view="content-operations" type="button"><span data-icon="archive"></span><span>内容运营</span></button>
        <button class="nav-item" data-view="system-settings" type="button"><span data-icon="settings"></span><span>系统设置</span></button>
      </nav>
      <div class="sidebar-foot">
        <a href="/ai/"><span data-icon="chart"></span>返回 AI 实验室</a>
        <a href="/"><span data-icon="home"></span>返回主站</a>
      </div>
    </aside>

    <div class="admin-workspace">
      <header class="admin-topbar">
        <button class="icon-button mobile-menu" id="mobileMenuButton" type="button" aria-label="打开导航" aria-expanded="false"><span data-icon="menu"></span></button>
        <div class="topbar-context"><span class="status-dot"></span><span>生产环境</span><strong id="currentViewName">运营总览</strong></div>
        <div class="admin-realtime-status" id="adminRealtimeStatus" data-state="connecting" aria-live="polite" aria-label="实时连接中" title="正在连接服务器实时推送">
          <span class="admin-realtime-dot" aria-hidden="true"></span>
          <span id="adminRealtimeStatusText">实时连接中</span>
          <time id="adminRealtimeLastAt"></time>
        </div>
        <label class="quick-nav" for="adminQuickNavSearch">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="adminQuickNavSearch" type="search" autocomplete="off" placeholder="搜索管理模块" aria-label="搜索管理模块">
          <kbd>/</kbd>
        </label>
        <div class="topbar-actions">
          <button class="icon-button topbar-icon-button theme-toggle-button" id="themeToggleButton" type="button" aria-label="切换到深色模式" aria-pressed="false">
              <span data-theme-icon aria-hidden="true"></span>
              <span class="sr-only" data-theme-label>切换主题</span>
          </button>
          <button class="icon-button topbar-icon-button" id="refreshButton" type="button" aria-label="刷新当前页面"><span data-icon="refresh"></span></button>
          <button class="account-button" id="accountButton" type="button" aria-label="当前管理员账户"><span class="account-avatar">管</span><span id="accountName">管理员</span></button>
        </div>
      </header>
      <main id="adminMain" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <div class="modal-layer" id="userModal" hidden>
    <div class="modal-scrim" data-close-modal></div>
    <section class="user-modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <header class="modal-header user-modal-header">
        <div class="user-modal-title"><span class="user-modal-title-icon" id="userModalAvatar" aria-hidden="true">用</span><div class="user-modal-title-copy"><span class="eyebrow">用户运营档案</span><div class="user-modal-heading-line"><h2 id="userModalTitle">用户详情</h2><span id="userModalMembership"></span></div><div class="user-modal-meta" id="userModalMeta" aria-label="用户摘要"></div></div></div>
        <button class="icon-button" type="button" data-close-modal aria-label="关闭用户详情"><span data-icon="close"></span></button>
      </header>
      <div class="modal-body" id="userModalBody"></div>
    </section>
  </div>
  <div class="modal-layer" id="confirmModal" hidden>
    <div class="modal-scrim" data-cancel-confirm></div>
    <section class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-describedby="confirmModalMessage">
      <span class="eyebrow">请确认操作</span>
      <h2 id="confirmModalTitle">确认继续？</h2>
      <p id="confirmModalMessage"></p>
      <label class="field confirm-required-field" id="confirmRequiredField" hidden><span id="confirmRequiredLabel">请输入确认内容</span><input class="input" id="confirmRequiredInput" autocomplete="off"></label>
      <div class="form-actions">
        <button class="secondary-button" type="button" data-cancel-confirm>取消</button>
        <button class="primary-button" id="confirmModalButton" type="button">确认</button>
      </div>
    </section>
  </div>
  <div class="modal-layer" id="contentModal" hidden>
    <div class="modal-scrim" data-close-content-modal></div>
    <section class="workspace-modal course-editor-modal" role="dialog" aria-modal="true" aria-labelledby="contentModalTitle">
      <header class="modal-header course-editor-modal-header">
        <div class="course-editor-modal-title"><span class="course-editor-modal-icon" data-icon="book" aria-hidden="true"></span><div><span class="eyebrow">课程内容中心</span><h2 id="contentModalTitle">编辑课程</h2><p id="contentModalSubtitle">完善课程信息、内容来源和发布权限。</p></div></div>
        <div class="course-editor-modal-tools"><span class="course-editor-state-pill" id="contentModalState"><i aria-hidden="true"></i><span>正在读取课程</span></span><button class="icon-button" type="button" data-close-content-modal aria-label="关闭课程编辑"><span data-icon="close"></span></button></div>
      </header>
      <div class="modal-body" id="contentModalBody"></div>
    </section>
  </div>
  <div class="modal-layer" id="entityModal" hidden>
    <div class="modal-scrim" data-close-entity-modal></div>
    <section class="workspace-modal compact-modal" role="dialog" aria-modal="true" aria-labelledby="entityModalTitle">
      <header class="modal-header">
        <div><span class="eyebrow" id="entityModalEyebrow">运营配置</span><h2 id="entityModalTitle">编辑配置</h2></div>
        <button class="icon-button" type="button" data-close-entity-modal aria-label="关闭编辑窗口"><span data-icon="close"></span></button>
      </header>
      <div class="modal-body" id="entityModalBody"></div>
    </section>
  </div>
  <div class="modal-layer admin-account-modal" id="adminAccountModal" hidden aria-hidden="true">
    <div class="modal-scrim" data-close-admin-account></div>
    <section class="admin-account-dialog" role="dialog" aria-modal="true" aria-labelledby="adminAccountModalTitle">
      <h2 id="adminAccountModalTitle" class="sr-only">账户与订阅中心</h2>
      <button class="icon-button admin-account-close" id="adminAccountCloseButton" type="button" data-close-admin-account aria-label="关闭账户与订阅中心"><span data-icon="close"></span></button>
      <iframe id="adminAccountFrame" title="账户与订阅中心"></iframe>
    </section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="/shared/session.js?v=20260724wsfix1"></script>
  <script type="module" src="/admin/app.js?v=20260805scheduler2"></script>
</body>
</html>
