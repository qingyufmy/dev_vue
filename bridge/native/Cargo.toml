[workspace]
members = [
  "apps/bridge-compat-probe",
  "apps/bridge-core",
  "crates/bridge-contract",
  "crates/bridge-foundation",
  "crates/bridge-observability",
  "crates/bridge-runtime-win",
  "crates/bridge-security-win",
  "crates/bridge-store",
]
resolver = "3"

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
