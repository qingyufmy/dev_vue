[workspace]
members = [
  "apps/bridge-compat-probe",
  "apps/bridge-core",
  "apps/bridge-installer",
  "apps/bridge-bootstrapper",
  "apps/bridge-launcher",
  "apps/bridge-update-rehearsal",
  "apps/bridge-ui",
  "crates/bridge-contract",
  "crates/bridge-command",
  "crates/bridge-foundation",
  "crates/bridge-local-control",
  "crates/bridge-mt4",
  "crates/bridge-observability",
  "crates/bridge-preferences",
  "crates/bridge-runtime-win",
  "crates/bridge-security-win",
  "crates/bridge-store",
  "crates/bridge-terminal-data",
  "crates/bridge-terminal-session",
  "crates/bridge-transport",
  "crates/bridge-ui-model",
  "crates/bridge-update",
  "crates/bridge-worker-host",
]
resolver = "3"

[workspace.package]
version = "3.0.2"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
futures-util = "=0.3.33"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "url"] }
url = { version = "=2.5.8", features = ["serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "=0.6.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
