[workspace]
members = [
  "apps/bridge-core",
  "crates/bridge-contract",
  "crates/bridge-foundation",
]
resolver = "3"

[workspace.package]
version = "4.0.0-alpha.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
